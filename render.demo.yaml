# Prepared template only. Importing this Blueprint provisions paid resources:
# obtain explicit identity/cost/deployment approval first. No automatic migrations.
services:
  - type: web
    name: navapack-demo-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/ready/
    autoDeployTrigger: 'off'
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.demo
      - key: APP_ENV
        value: DEMO
      - key: DJANGO_DEBUG
        value: "false"
      - key: TRUST_PROXY_HTTPS
        value: "true"
      - key: POSTGRES_SSLMODE
        value: verify-full
      - key: PGSSLROOTCERT
        value: /etc/ssl/certs/ca-certificates.crt
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: JWT_SIGNING_KEY
        sync: false
      - key: DEMO_EXECUTION_SECRET
        sync: false
      - key: DEMO_INSTANCE_ID
        sync: false
      - key: DEMO_DATABASE_NAME
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        value: "5432"
# Database provisioning is intentionally manual: approve region, tier, name,
# migration-owner/runtime roles, backup plan and certificate-verified endpoint.
