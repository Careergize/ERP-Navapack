name: Reviewable demo validation (no deployment)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag navapack-demo-review:local --file backend/Dockerfile backend
      - run: docker run --rm --entrypoint python navapack-demo-review:local -c 'import gunicorn; print(gunicorn.__version__)'
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node node_modules/typescript/bin/tsc --noEmit
      - run: npm run build
      - run: for script in scripts/check-*.mjs; do node "$script"; done
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: navapack_ci
          POSTGRES_USER: ci_owner
          POSTGRES_PASSWORD: ${{ secrets.DEMO_CI_POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_owner -d navapack_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      POSTGRES_DB: navapack_ci
      POSTGRES_USER: ci_owner
      POSTGRES_PASSWORD: ${{ secrets.DEMO_CI_POSTGRES_PASSWORD }}
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_SSLMODE: disable
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r backend/requirements/deploy.txt
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - run: npm ci
        working-directory: frontend
      - run: python scripts/test_isolated.py --synthetic-ledger
        working-directory: backend
      - run: python manage.py check
        working-directory: backend
      - run: python manage.py makemigrations --check --dry-run
        working-directory: backend
